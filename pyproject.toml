[project]
name = "opendata-sh-mcp"
version = "0.1.0"
description = "MCP server for the Schleswig-Holstein open data portal (opendata.schleswig-holstein.de)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
opendata-sh-mcp = "opendata_sh_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_sh_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
